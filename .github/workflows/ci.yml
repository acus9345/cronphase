name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Lint
        run: uv run python -m compileall -q -x "(\.venv|build|dist)" .
      - name: Build
        run: uv build
      - name: Test
        run: uv run python -m unittest discover -s tests -t .
